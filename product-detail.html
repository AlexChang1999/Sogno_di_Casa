<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳情 — FORMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top forma-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand forma-logo" href="index.html">FORMA</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <i class="bi bi-list fs-4"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto gap-4">
          <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">商品</a></li>
          <li class="nav-item"><a class="nav-link" href="#">關於品牌</a></li>
          <li class="nav-item"><a class="nav-link" href="#">設計師</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="#" class="nav-icon"><i class="bi bi-search"></i></a>
          <a href="#" class="nav-icon"><i class="bi bi-person"></i></a>
          <a href="cart.html" class="nav-icon cart-icon">
            <i class="bi bi-bag"></i>
            <span class="cart-badge" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb forma-breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">首頁</a></li>
          <li class="breadcrumb-item"><a href="products.html">商品</a></li>
          <li class="breadcrumb-item active" id="breadcrumbProduct">商品詳情</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- PRODUCT DETAIL -->
  <section class="section-pad">
    <div class="container">
      <div class="row g-5">

        <!-- LEFT: Image Gallery with Magnifier -->
        <div class="col-12 col-lg-6">
          <div class="gallery-wrap">

            <!-- Main image with magnifier -->
            <div class="magnifier-container" id="magnifierContainer">
              <img id="mainImage"
                   src=""
                   alt="Product Image"
                   class="gallery-main-img">
              <!-- Magnifier lens -->
              <div class="magnifier-lens" id="magnifierLens"></div>
              <!-- Magnifier result (zoomed view) -->
              <div class="magnifier-result" id="magnifierResult"></div>
            </div>

            <!-- Thumbnail Strip（由 JS 動態填入，最多4張） -->
            <div class="thumb-strip" id="thumbStrip">
              <img class="thumb active" src="" data-full="" onclick="switchImage(this)" alt="view 1" style="display:none;">
              <img class="thumb" src="" data-full="" onclick="switchImage(this)" alt="view 2" style="display:none;">
              <img class="thumb" src="" data-full="" onclick="switchImage(this)" alt="view 3" style="display:none;">
              <img class="thumb" src="" data-full="" onclick="switchImage(this)" alt="view 4" style="display:none;">
            </div>

            <p class="magnifier-hint"><i class="bi bi-zoom-in me-1"></i> 滑鼠移至圖片可放大查看細節</p>
          </div>
        </div>

        <!-- RIGHT: Product Info -->
        <div class="col-12 col-lg-6">
          <div class="product-detail-info">
            <p class="detail-brand" id="detailBrand"></p>
            <h1 class="detail-name" id="detailName">載入中...</h1>

            <p class="detail-price" id="detailPrice"></p>

            <p class="detail-desc" id="detailDescription"></p>

            <!-- Color Options（由 JS 動態產生，無資料時自動隱藏） -->
            <div class="option-group" id="colorSection" style="display:none;">
              <h6 class="option-label">顏色 <span class="option-selected" id="colorSelected"></span></h6>
              <div class="color-swatches" id="colorSwatchGroup"></div>
            </div>

            <!-- Wood Options（由 JS 動態產生，無資料時自動隱藏） -->
            <div class="option-group" id="woodSection" style="display:none;">
              <h6 class="option-label">木材 <span class="option-selected" id="woodSelected"></span></h6>
              <div class="d-flex gap-2 flex-wrap" id="woodBtnGroup"></div>
            </div>

            <!-- Quantity -->
            <div class="option-group">
              <h6 class="option-label">數量</h6>
              <div class="qty-control">
                <button class="qty-btn" onclick="changeQty(-1)"><i class="bi bi-dash"></i></button>
                <span class="qty-num" id="qtyNum">1</span>
                <button class="qty-btn" onclick="changeQty(1)"><i class="bi bi-plus"></i></button>
              </div>
            </div>

            <!-- CTA Buttons -->
            <div class="d-flex flex-column gap-3 mt-4">
              <button class="btn-forma-full" onclick="addToCartDetail()">
                <i class="bi bi-bag-plus me-2"></i> 加入購物車
              </button>
              <button class="btn-forma-outline" onclick="window.location='cart.html'">
                立即購買
              </button>
            </div>

            <!-- Meta info -->
            <div class="detail-meta mt-4">
              <div class="meta-row">
                <span class="meta-key"><i class="bi bi-truck me-2"></i>配送</span>
                <span class="meta-val">預計 7-14 個工作天到府安裝</span>
              </div>
              <div class="meta-row">
                <span class="meta-key"><i class="bi bi-shield-check me-2"></i>保固</span>
                <span class="meta-val">5 年原廠品質保固</span>
              </div>
              <div class="meta-row">
                <span class="meta-key"><i class="bi bi-arrow-counterclockwise me-2"></i>退換</span>
                <span class="meta-val">30 天鑑賞期，全額退款</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PRODUCT TABS -->
      <div class="product-tabs mt-5">
        <ul class="nav nav-tabs forma-tabs" id="productTabs">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabSpec">規格</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabStory">品牌故事</button>
          </li>
        </ul>
        <div class="tab-content forma-tab-content">
          <div class="tab-pane fade show active" id="tabSpec">
            <!-- 規格表由 detail.js renderSpecs() 動態填入 -->
            <div class="row g-3 spec-grid" id="specGrid">
              <div class="col-12 text-muted" style="font-size:.85rem;">載入中...</div>
            </div>
          </div>
          <div class="tab-pane fade" id="tabStory">
            <!-- 品牌故事由 detail.js renderBrandStory() 動態填入 -->
            <div class="story-content" id="storyContent">
              <p style="color:#999;">載入中...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Related Products（由 JS 動態載入同類別商品） -->
      <div class="mt-6" id="relatedSection" style="display:none;">
        <div class="section-header">
          <span class="section-label">您可能也喜歡</span>
          <h2 class="section-title">相關商品</h2>
        </div>
        <div class="row g-4" id="relatedGrid"></div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="forma-footer">
    <div class="container">
      <div class="footer-bottom py-4">
        <p>© 2025 FORMA. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="cartToast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body"><i class="bi bi-check-circle me-2"></i> 已加入購物車！</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script src="detail.js"></script>
</body>
</html>
